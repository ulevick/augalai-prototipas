<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Augalai prototipas</title>
<meta name="description" content="ND3 GUI prototipas: F1 augalo atpažinimas ir F2 ligų patikra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e9efe8; --panel:#f7faf5; --paper:#ffffff; --ink:#15241b; --mute:#5d6e63; --line:#d3ddd3;
  --fill:#eef4ec; --fill2:#dce8da; --strong:#1f5135; --onstrong:#ffffff; --leaf:#3f8f5a;
  --amber:#8f5308; --amberbg:#fdf1dc; --amberline:#f0c77c;
  --red:#a32626; --redbg:#fdecea; --redline:#f1b4ae;
  --blue:#1d4f7a; --bluebg:#e8f1f9; --blueline:#b7d0e6;
  --demo:#6b4fa0; --demobg:#f4f0fb;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:16px; --shadow:0 1px 0 var(--line),0 8px 24px -14px rgba(21,36,27,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --panel:#152019; --paper:#1a271f; --ink:#e6efe7; --mute:#97a99c; --line:#2c3d32;
  --fill:#213027; --fill2:#2b3d31; --strong:#8fd19e; --onstrong:#0f1712; --leaf:#6cbf82;
  --amber:#f2b552; --amberbg:#2c2213; --amberline:#6b4d1b; --red:#ff9f97; --redbg:#331816; --redline:#6e2c27;
  --blue:#9cc8f0; --bluebg:#15263a; --blueline:#2d4a66; --demo:#c3a9f2; --demobg:#241d36; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --panel:#152019; --paper:#1a271f; --ink:#e6efe7; --mute:#97a99c; --line:#2c3d32;
  --fill:#213027; --fill2:#2b3d31; --strong:#8fd19e; --onstrong:#0f1712; --leaf:#6cbf82;
  --amber:#f2b552; --amberbg:#2c2213; --amberline:#6b4d1b; --red:#ff9f97; --redbg:#331816; --redline:#6e2c27;
  --blue:#9cc8f0; --bluebg:#15263a; --blueline:#2d4a66; --demo:#c3a9f2; --demobg:#241d36; --shadow:none; color-scheme:dark}
:root.big{--fs:19px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--panel);display:flex;flex-direction:column;position:relative}
header.bar{position:sticky;top:0;z-index:5;background:var(--panel);display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
header.bar h1{font-family:var(--disp);font-size:1.3em;line-height:1.15;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{border:0;background:var(--fill);color:var(--strong);border-radius:999px;min-height:44px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:4px;flex:none}
.ibtn{border:0;background:var(--fill);color:var(--strong);border-radius:999px;width:44px;height:44px;display:inline-grid;place-items:center;flex:none;font-weight:700}
main{flex:1;padding:6px 16px 120px;display:grid;gap:14px;align-content:start}
main.has-act{padding-bottom:210px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:6;padding-bottom:env(safe-area-inset-bottom,0)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;font-size:.74em;display:grid;justify-items:center;gap:3px;color:var(--mute);min-height:60px;font-weight:500}
nav.tabs button.on{color:var(--strong);font-weight:700}
.act{position:fixed;left:50%;transform:translateX(-50%);bottom:60px;width:100%;max-width:430px;padding:14px 16px 12px;background:linear-gradient(to bottom,transparent,var(--panel) 22%);display:grid;gap:8px;z-index:5}
svg.ic{flex:none}
.sbar{display:none}
h2{font-family:var(--disp);font-size:1.45em;line-height:1.15;margin:4px 0 0;text-wrap:balance}
h3{font-family:var(--disp);font-size:1.08em;line-height:1.2;margin:0}
p{margin:0}
.mute{color:var(--mute)}
main{overflow-wrap:anywhere} .small{font-size:.88em} .xs{font-size:.78em}
.lbl{font-family:var(--mono);font-size:.72em;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);outline:1px solid var(--line);padding:16px;display:grid;gap:10px}
.card.soft{background:var(--fill);outline:0;box-shadow:none}
.card.hero{background:linear-gradient(160deg,var(--fill2),var(--fill));outline:0;box-shadow:none;border-radius:22px;padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;padding:10px 14px;text-align:center;line-height:1.2}
.btn.pri{background:var(--strong);color:var(--onstrong);border-color:var(--strong)}
.btn.big{min-height:58px;font-size:1.05em}
.btn.soft{border:0;background:var(--fill);color:var(--strong)}
.btn.danger{color:var(--red);border-color:var(--redline)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--strong);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px 0;min-height:44px;text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{flex:1}
.stack{display:grid;gap:10px}
.note{border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;border:1px solid;align-items:start}
.note>svg{grid-row:span 3;margin-top:2px}
.note>*:not(svg){grid-column:2}
.note b.t{font-weight:700}
.note.warn{background:var(--amberbg);border-color:var(--amberline);color:var(--ink)} .note.warn>svg,.note.warn b.t{color:var(--amber)}
.note.err{background:var(--redbg);border-color:var(--redline)} .note.err>svg,.note.err b.t{color:var(--red)}
.note.info{background:var(--bluebg);border-color:var(--blueline)} .note.info>svg,.note.info b.t{color:var(--blue)}
.note.ok{background:var(--fill2);border-color:transparent} .note.ok>svg,.note.ok b.t{color:var(--strong)}
.note .btn{margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:.7em;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--mute);background:var(--paper)}
.chip.ai{background:var(--strong);color:var(--onstrong);border-color:var(--strong)}
.chip.hi{background:var(--fill2);color:var(--strong);border-color:transparent}
.chip.mid{background:var(--amberbg);color:var(--amber);border-color:var(--amberline)}
.chip.lo{background:var(--redbg);color:var(--red);border-color:var(--redline)}
.chip.demo{background:var(--demobg);color:var(--demo);border:1px dashed var(--demo)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ph{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--fill)}
.ph svg,.ph img{width:100%;height:100%;display:block;object-fit:cover}
.ph .cap{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);background:rgba(255,255,255,.92);color:#15241b;font-family:var(--mono);font-size:.66em;padding:2px 7px;border-radius:999px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.demo{border:1.5px dashed var(--demo);background:var(--demobg);border-radius:18px;padding:12px;display:grid;gap:10px}
.sample{border:2px solid transparent;background:var(--paper);border-radius:16px;padding:6px 6px 8px;display:grid;gap:5px;text-align:left;box-shadow:var(--shadow)}
.sample[aria-pressed="true"]{border-color:var(--strong);background:var(--fill2)}
.sample b{font-size:.8em;line-height:1.2;font-weight:600}
.sample .h{font-family:var(--mono);font-size:.62em;color:var(--mute);line-height:1.3}
.sample[aria-pressed="true"] .h{color:var(--ink)}
.meter{height:8px;background:var(--fill2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--strong);border-radius:4px}
.meter.mid i{background:var(--amber)} .meter.lo i{background:var(--red)}
.la{font-style:italic;color:var(--mute)}
.big-pct{font-family:var(--disp);font-size:2em;font-weight:700;line-height:1}
.crow{display:grid;grid-template-columns:auto 52px 1fr auto;gap:12px;align-items:center;width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 12px 8px 10px;text-align:left;cursor:pointer}
.crow.sel{border-color:var(--strong);background:var(--fill)}
.crow input{width:20px;height:20px;accent-color:var(--strong);margin:0}
.crow .ph{border-radius:10px}
.crow .n{font-weight:600;line-height:1.2}
.crow .pc{font-family:var(--mono);font-size:.92em}
label.f{display:grid;gap:6px;font-weight:600}
label.f .h{font-weight:400;font-size:.85em;color:var(--mute)}
input[type=text],input[type=search],select,textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;min-height:48px;padding:10px 12px;width:100%}
[aria-invalid="true"]{border-color:var(--red)!important}
.err-t{color:var(--red);font-size:.86em;font-weight:600;display:flex;gap:6px;align-items:center}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:600;padding:0;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{border:1.5px solid var(--line);border-radius:12px;min-height:46px;display:grid;place-items:center;background:var(--paper);cursor:pointer;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--strong);color:var(--onstrong);border-color:var(--strong)}
.seg label:has(input:focus-visible){outline:3px solid var(--leaf);outline-offset:2px}
.sw{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--strong);flex:none;margin:1px 0 0}
.prog{height:10px;border-radius:5px;background:var(--fill2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--strong);transition:width .3s}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:12px;width:calc(100% - 32px);max-width:398px;background:var(--ink);color:var(--panel);border-radius:16px;padding:10px 10px 10px 14px;display:flex;gap:10px;align-items:center;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast p{flex:1;font-weight:500}
.toast button{background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:12px;min-height:42px;padding:0 12px;font-weight:700;white-space:nowrap}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:0;background:var(--paper);border-radius:16px;padding:8px 12px 8px 8px;box-shadow:var(--shadow);outline:1px solid var(--line)}
.prow .ph{border-radius:10px}
details.more{border-radius:16px;background:var(--fill);padding:4px 14px}
details.more summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";margin-left:auto;font-family:var(--mono);font-size:1.2em}
details.more[open] summary::after{content:"−"}
details.more>div{padding:0 0 12px;display:grid;gap:8px}
table{border-collapse:collapse;width:100%;font-size:.84em}
td,th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:.85em;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tier{display:grid;gap:8px;padding:12px 14px;border-radius:16px;background:var(--paper);outline:1px solid var(--line)}
.tier label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tier input{width:20px;height:20px;accent-color:var(--strong);flex:none;margin-top:2px}
.tier .lbl{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.kv{display:grid;gap:10px}
.kv>div{display:grid;gap:2px}
.kv b{font-family:var(--mono);font-size:.72em;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500}
.kv span{font-size:.92em}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.thumbs>div{width:104px;flex:none;display:grid;gap:6px}
.thumbs select{min-height:40px;padding:6px 8px;font-size:.82em;border-radius:10px}
.x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#15241b;display:grid;place-items:center}
.vf{position:relative;border-radius:22px;background:#13201a;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;color:#e6efe7}
.vf .corner{position:absolute;width:28px;height:28px;border:3px solid #fff;opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spacer{height:4px}
/* Kompiuteryje: web išdėstymas su šoniniu meniu; telefone: mobilus */
@media (min-width:900px){
body{background:var(--bg)}
.app{max-width:none;margin:0 0 0 248px;min-height:100vh;background:var(--bg)}
header.bar,main,.act{box-sizing:border-box;width:100%;max-width:780px;margin-left:auto;margin-right:auto}
header.bar{padding:26px 32px 10px;background:var(--bg)}
header.bar h1{font-size:1.6em}
main,main.has-act{padding:8px 32px 28px}
.act{position:sticky;left:auto;transform:none;bottom:0;padding:16px 32px 24px;background:linear-gradient(to bottom,transparent,var(--bg) 22%);grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
nav.tabs{top:0;bottom:0;left:0;transform:none;width:248px;max-width:none;box-sizing:border-box;border-top:0;border-right:1px solid var(--line);grid-template-columns:1fr;align-content:start;gap:4px;padding:24px 14px}
nav.tabs::before{content:"Augalai";font-family:var(--disp);font-size:1.5em;font-weight:700;color:var(--strong);padding:4px 14px 18px}
nav.tabs button{display:flex;align-items:center;justify-content:flex-start;gap:12px;font-size:.98em;min-height:48px;padding:10px 14px;border-radius:12px}
nav.tabs button.on{background:var(--fill)}
nav.tabs button:hover{background:var(--fill)}
main{flex:0 0 auto}
main .grid3,.ph[style*="max-width"]{max-width:540px}
.demo .grid3{max-width:none;grid-template-columns:repeat(6,1fr)}
.demo .grid2{grid-template-columns:repeat(4,1fr)}
.toast{top:20px;left:auto;right:24px;transform:none;width:380px}
}
</style>

<script>
"use strict";
/* ================= DUOMENYS (pavyzdiniai) ================= */
const SP={
  mon:{lt:'Nuostabioji monstera',la:'Monstera deliciosa',danger:'toxic',img:'mon',cmp:['mon','mon2'],feat:'Dideli širdiški lapai su įpjovomis iki pat krašto ir ovaliomis skylėmis.'},
  ada:{lt:'Adansono monstera',la:'Monstera adansonii',danger:'toxic',img:'ada',cmp:['ada','ada'],feat:'Mažesni, pailgi lapai; skylės uždaros, lapo kraštas vientisas (be įpjovų).'},
  philo:{lt:'Dvigubai plunksniškasis filodendras',la:'Thaumatophyllum bipinnatifidum',danger:'toxic',img:'philo',cmp:['philo','philo'],feat:'Giliai skiautėti lapai, bet be skylių lapo viduryje.'},

  rubus:{lt:'Paprastoji avietė',la:'Rubus idaeus',danger:null,img:'rose',cmp:['rose','rose'],feat:'Lapeliai apačioje balkšvi ir plaukuoti; stiebai smulkiai dygliuoti.'},
  ficus:{lt:'Tamprusis fikusas',la:'Ficus elastica',danger:'toxic',img:'leaf'},
  chloro:{lt:'Žaliasis chlorofitas',la:'Chlorophytum comosum',danger:null,img:'leaf'},
  hedera:{lt:'Paprastoji gebenė',la:'Hedera helix',danger:'toxic',img:'leaf'},
  dracaena:{lt:'Trijuostė drakena (sansevjera)',la:'Dracaena trifasciata',danger:'toxic',img:'leaf'},
  phal:{lt:'Falenopsis (orchidėja)',la:'Phalaenopsis sp.',danger:null,img:'leaf'},
  monGen:{lt:'Monstera (gentis)',la:'Monstera sp.',danger:'toxic',img:'mon',genus:true,feat:'Gentis nustatyta, bet rūšiai atskirti reikia lapo nuotraukos.'},
};
const CATALOG=['mon','ada','philo','pothos','ficus','chloro','hedera','dracaena','phal','rose','canina','rubus','sos','man','her'];
const DANGER={
  toxic:{t:'Nuodingas augalas',d:'Kalcio oksalatai dirgina burną ir virškinimo traktą. Laikyk toliau nuo kačių, šunų ir mažų vaikų.'},
  burn:{t:'Pavojinga! Nudegina odą',d:'Sultys saulės šviesoje sukelia sunkius odos nudegimus. Neliesk plikomis rankomis. Invazinė rūšis: radavietę gali pranešti savivaldybei.'},
};
/* F1 nuotraukų pavyzdžiai: kiekvienas parodo kitą veiklos diagramos šaką */
const F1S=[
  {id:'mon',img:'mon',t:'Monstera',k:'bazinis kelias',part:'Lapas'},
  {id:'blur',img:'monBlur',t:'Neryški nuotrauka',k:'K1',part:'Lapas',bad:'Nuotrauka neryški ir per tamsi.'},

function say(t){document.getElementById('live').textContent=t}
function toast(text,undoFn,secs=10){
  if(S.toast&&S.toast.iv)clearInterval(S.toast.iv);
  S.toast={text,undoFn,left:secs};
  S.toast.iv=setInterval(()=>{S.toast.left--;if(S.toast.left<=0){clearInterval(S.toast.iv);S.toast=null}renderToast()},1000);
  renderToast();say(text);
}
function renderToast(){
  let el=document.getElementById('toast');
  if(!S.toast){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');(document.querySelector('.phone')||document.body).appendChild(el)}
  el.innerHTML=`<p>${esc(S.toast.text)}</p>${S.toast.undoFn?`<button data-a="undo">Atšaukti (${S.toast.left} s)</button>`:''}`;
}

  <tr><td>A4 katalogas be DI</td><td>Rezultate „Nė vienas netinka“</td></tr>

/* ---------- Apie DI ---------- */
T.about='Kaip veikia DI';
V.about=()=>`
<p class="small mute">Prototipe DI rezultatai imituojami pavyzdiniais duomenimis. Čia aprašyta, kaip veiktų tikri modeliai.</p>
<div class="card">
  <div class="chips"><span class="chip ai">F1</span><h3>Augalo atpažinimas</h3></div>
  <div class="kv">
  <div><b>Uždavinio tipas</b><span>Vaizdų klasifikavimas į daug klasių: top-3 rūšys su kalibruotu tikrumu. Prieš tai veikia nuotraukos kokybės klasifikatorius (ryški / neryški, augalas / ne, kuri augalo dalis).</span></div>
  <div><b>Modelis</b><span>Esamas atpažinimo modelis per API (ne kuriamas savas), suderintas Lietuvos augalijai. Tikrumas kalibruojamas (temperature scaling): 80 % reiškia „teisinga maždaug 8 iš 10 kartų“.</span></div>
  <div><b>Duomenų rinkinys</b><span>PlantNet-300K ir iNaturalist stebėjimai Lietuvoje, papildyti panašiomis ir pavojingomis rūšimis (barščiai). Kokybės modeliui – dirbtinai sugadintos nuotraukos (neryškios, tamsios).</span></div>
  <div><b>Žymės</b><span>Rūšies lotyniškas pavadinimas, gentis, augalo dalis, kokybė (tinkama / netinkama). Naudotojų patvirtinimai ir pataisymai – papildomos žymės, specialisto pataisymas turi didesnį svorį. Nuotraukos mokymui – tik su sutikimu.</span></div>
  <div><b>Slenksčiai</b><span>Aukštas ≥ 80 %, vidutinis 50–79 %, žemas &lt; 50 %. „Nesu tikras“, kai top-1 &lt; 50 % arba top-1 ir top-2 skiriasi &lt; 15 proc. punktų.</span></div>
  </div>
  ${note('info','shield','Brangesnė klaida: klaidingai teigiama (FP)','Užtikrintai pasakyta neteisinga rūšis (pvz., Mantegacio vietoj Sosnovskio barščio) keliauja į ligų patikrą ir priežiūrą, o pavojingos rūšies supainiojimas kenkia sveikatai. FN („neatpažinta“) tik palieka be atsakymo, tada siūlome nuotrauką ar katalogą. Todėl juostai „Aukštas“ prioritetas yra <b>precision</b>, o top-3 <b>recall</b> užtikrina, kad teisinga rūšis būtų tarp kandidatų.')}
</div>
<div class="card">
  <div class="chips"><span class="chip ai">F2</span><h3>Ligų patikra</h3></div>
  <div class="kv">
  <div><b>Uždavinio tipas</b><span>Klasifikavimas (iki 3 ligų ar kenkėjų + klasė „ligos požymių nerasta“) ir objektų aptikimas (pažeistų vietų žymėjimas). Gydymo veiksmai – iš patikrintos bazės pagal patvirtintą diagnozę.</span></div>
  <div><b>Duomenų rinkinys</b><span>PlantVillage ir PlantDoc + Lietuvos sodų nuotraukos (rožės, obelys, daržovės), pažymėtos su augalų apsaugos specialistais; kiekvienai ligai – ir panašūs „ne ligos“ atvejai.</span></div>
  <div><b>Žymės</b><span>Ligos ar kenkėjo klasė, „ne liga“ klasės (maisto medžiagų trūkumas, saulės nudegimas), pažeistų vietų rėmeliai, rūšis iš F1, specialisto patvirtinimas, „gerėja / negerėja“ po 7 d.</span></div>
  <div><b>Slenksčiai</b><span>&lt; 50 % – būsena „Neaišku“, chemijos nėra, siūloma nauja nuotrauka arba specialistas. Cheminės priemonės – tik ≥ 50 % ir patvirtinus. Žodžio „Sveikas“ nenaudojame.</span></div>
  </div>
  ${note('info','shield','Brangesnė klaida: klaidingai neigiama (FN)','Praleista liga plinta ir sunaikina derlių (ND1: „Healthy!“ sergančiam lapui, PR-19). FP kainuoja mažiau, nes pirmiausia siūlomi nekenksmingi veiksmai, o chemija tik patvirtinus. Todėl prioritetas yra <b>recall</b> būsenai „serga“.')}
</div>
<div class="card">
  <h3>Žmogaus kontrolė (HITL)</h3>
  <ul class="clean small">
  <li><b>F1:</b> rūšis išsaugoma ir perduodama F2 tik paspaudus „Tai mano augalas“; žemam tikrumui reikia papildomo patvirtinimo.</li>
  <li><b>F2:</b> diagnozę patvirtina „Panašu“, veiksmus renkasi pats, priminimą įjungia pats, „gerėja / negerėja“ vertina pats.</li>
  <li><b>Abi:</b> „Atšaukti“ 10 s, rūšies keitimas, ištrynimas, katalogas be DI, specialistas.</li>
  </ul>
  <p class="xs mute">Remiamasi ND1 kontroliniu sąrašu: Microsoft HAI gairės G1–G2, G4, G8–G11, G15–G16, Nielseno klaidų prevencija ir atstatymas, WCAG 2.2 (etiketės, kontrastas, 44 px tiksliniai plotai, didelis šriftas).</p>
</div>`;

T.intro='Prieš pirmą nuotrauką';
V.intro=()=>`
<h2>Kas bus siunčiama?</h2>
<div class="card soft">
  <p class="small row">${I('check',18)} Tik nuotrauka ir tavo atsakymai</p>
  <p class="small row">${I('check',18)} GPS ir metaduomenys pašalinami telefone</p>
  <p class="small row">${I('check',18)} Atšaukus analizę nuotrauka ištrinama</p>
</div>
<div class="card">
  <label class="sw"><input type="checkbox" data-a="tog" data-v="loc" ${S.loc?'checked':''}><span><b>Naudoti apytikslį regioną</b><br><span class="small mute">Padeda atskirti Lietuvoje augančias rūšis.</span></span></label>
  <label class="sw"><input type="checkbox" data-a="tog" data-v="train" ${S.train?'checked':''}><span><b>Leisti nuotraukas ir pataisymus naudoti modeliui gerinti</b><br><span class="small mute">Neprivaloma, galėsi pakeisti.</span></span></label>

/* ---------- F1: nuotraukos ---------- */
T.f1cap='Atpažinti augalą';
V.f1cap=()=>{const f=S.f1;const sel=id=>f.photos.some(p=>p.sample===id);
return `
<p class="mute">1–3 nuotraukos: lapas, žiedas arba visas augalas. Fotografuok visą lapą iš arti, šviesoje.</p>
<div class="demo">
  <div class="row" style="justify-content:space-between"><span class="chip demo">Prototipas · kamera</span><span class="xs mute">Pasirink 1–3</span></div>
  <div class="grid3">${F1S.map(s=>`<button class="sample" data-a="f1pick" data-v="${s.id}" aria-pressed="${sel(s.id)}">${ph(s.img)}<b>${s.t}</b><span class="h">${s.k}</span></button>`).join('')}</div>
  <label class="sw small"><input type="checkbox" data-a="tog" data-v="slow" ${S.slow?'checked':''}><span>Imituoti silpną ryšį (K6)</span></label>
</div>
${f.err?`<p class="err-t" role="alert">${I('warn',18)} ${esc(f.err)}</p>`:''}
${f.photos.length?`<div class="stack"><span class="lbl">Pasirinkta ${f.photos.length} iš 3 · pažymėk augalo dalį</span>
<div class="thumbs">${f.photos.map((p,i)=>`<div><div style="position:relative">${ph(p.img,'','',p.url)}<button class="x" data-a="f1rm" data-i="${i}" aria-label="Pašalinti ${i+1} nuotrauką">${I('x',16)}</button></div>
<label><span class="sr">${i+1} nuotraukos augalo dalis</span><select data-a="f1part" data-i="${i}">${['Lapas','Žiedas','Stiebas','Visas augalas'].map(o=>`<option ${o===p.part?'selected':''}>${o}</option>`).join('')}</select></label></div>`).join('')}</div>
${f.photos.length===1?`<p class="xs mute">Patarimas: pridėjus žiedo ar viso augalo nuotrauką, panašias rūšis atskirti lengviau.</p>`:''}</div>`:''}`};
ACT.f1cap=()=>`<div class="row"><label class="btn" style="flex:0 0 auto;width:auto;cursor:pointer">${I('img')} Galerija<input type="file" accept="image/*" multiple data-a="f1file" class="sr"></label>
<button class="btn pri" data-a="f1analyze" ${S.f1.photos.length?'':'disabled'}>Analizuoti${S.f1.photos.length>1?' ('+S.f1.photos.length+')':''}</button></div>`;

/* ---------- K1 ---------- */
T.f1bad='Nuotraukos kokybė';
V.f1bad=()=>{const bad=S.f1.photos.filter(p=>p.bad);return `
${note('warn','warn','Nuotrauka neryški arba per tamsi','Laikyk telefoną stabiliai, priartink lapą ir fotografuok šviesoje. Analizė dar nepradėta.')}
<div class="grid2">${bad.map(p=>ph(p.img,p.bad,'',p.url)).join('')}</div>
<p class="small mute">Tai nereiškia, kad nuotraukoje nėra augalo. Jei analizuosi vis tiek, rezultatas bus pažymėtas žemu tikrumu.</p>`};
ACT.f1bad=()=>`<button class="btn pri big" data-a="f1retake">${I('cam')} Fotografuoti iš naujo</button><button class="btn" data-a="f1anyway">Vis tiek analizuoti</button>`;

/* ---------- Analizė ---------- */
T.an='Analizuojama';
V.an=()=>{const a=S.an;if(!a)return'';const pct=Math.min(100,a.t/a.need*100);
return `
<div class="grid3">${a.photos.map(p=>ph(p.img,'','',p.url)).join('')}</div>
${a.fn==='f1'&&a.stage!=='q'?note('ok','check','Nuotrauka tinkama'):''}
<div class="card">
  <h3>${a.fn==='f1'?(a.stage==='q'?'Tikrinama nuotraukos kokybė…':'Atpažįstama rūšis…'):'Ieškoma ligos požymių…'}</h3>
  <div class="prog" role="progressbar" aria-label="Analizės eiga" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <p class="xs mute">Praėjo ${a.t} s · įprastai iki ${a.fn==='f1'?3:5} s</p>
</div>
${a.slowAsk?note('warn','wifi','Analizė užtrunka','Ryšys silpnas. Gali palaukti arba atšaukti.'+(a.waiting?' Jei per 20 s neatsakys, nuotrauką išsaugosime eilėje.':''),a.waiting?'':`<button class="btn pri" data-a="anWait">Laukti</button>`):''}`};
ACT.an=()=>`<button class="btn" data-a="anCancel">${I('x')} Atšaukti analizę</button>`;

T.f1off='Nėra ryšio';
V.f1off=()=>note('warn','wifi','Nėra ryšio','Nuotrauka išsaugota eilėje telefone ir bus išsiųsta, kai atsiras ryšys. Pranešime, kai rezultatas bus paruoštas.');
ACT.f1off=()=>`<button class="btn pri" data-a="offRetry">${I('redo')} Bandyti dar kartą</button><div class="row"><button class="btn" data-a="home">Palikti eilėje</button><button class="btn danger" data-a="offDel">Ištrinti</button></div>`;

T.f1cancel='Analizė atšaukta';
V.f1cancel=()=>note('info','info','Analizė atšaukta','Nuotrauka ištrinta iš serverio. Niekas neišsaugota.');
ACT.f1cancel=()=>`<button class="btn pri" data-a="${S.cancelFn==='f2'?'f2again':'f1again'}">${I('cam')} Nauja nuotrauka</button><button class="btn" data-a="home">Į pradžią</button>`;

/* ---------- F1: rezultatas ---------- */
function f1isLow(o){const c=o.c;return !!o.genus||c[0][1]<50||c[0][1]-c[1][1]<15}
function dangerNote(keys){const ks=[...new Set(keys.map(k=>SP[k].danger).filter(Boolean))].sort((a,b)=>a==='burn'?-1:1);
  return ks.map(d=>{const names=keys.filter(k=>SP[k].danger===d).map(k=>SP[k].lt);
  return note('err','warn',DANGER[d].t,`${names.length>1?'Tarp kandidatų: ':''}${esc(names.join(', '))}. ${DANGER[d].d}`,`<p class="xs mute">Šaltinis: patikrinta pavojingų augalų bazė (taisyklė, ne DI)</p>`)}).join('')}
T.f1res='Rezultatas';
V.f1res=()=>{const f=S.f1,o=f.out,low=f1isLow(o),c=o.c;const top=c[0][1],gap=c[0][1]-c[1][1];
const [k,p]=c[f.sel],sp=SP[k],b=BAND(p);
let head='';
if(o.genus)head=note('warn','info',`Nustatyta tik gentis: ${SP[o.genus].lt} (${o.gp} %)`,`Šios rūšies duomenų turime nedaug, nes nufotografuota tik dalis augalo. ${o.ask}`,`<button class="btn" data-a="f1add">${I('plus')} Pridėti nuotrauką</button>`);
else if(low)head=note('warn','info','Nesu tikras',[top<50?`Geriausias kandidatas tik ${top} % (riba 50 %).`:'',gap<15?`Du pirmi skiriasi tik ${gap} p. p. (riba 15).`:'',o.poor?'Analizuota prasta nuotrauka.':''].join(' ')+' '+(o.ask||'Nufotografuok žiedą, stiebą ar visą augalą ryškiau.'),`<button class="btn" data-a="f1add">${I('plus')} Pridėti nuotrauką</button>`);
return `
<div class="row">${ph(f.photos[0].img,'','',f.photos[0].url).replace('class="ph"','class="ph" style="width:56px;flex:none"')}<span class="small mute">Analizuota: ${f.photos.length} nuotr. (${f.photos.map(p=>p.part.toLowerCase()).join(', ')})</span></div>
${head}
${low?dangerNote(c.map(x=>x[0])):''}
${o.spots?note('info','pulse','Matome dėmių ant lapų','Patvirtinus rūšį galėsi patikrinti, ar augalas serga.'):''}
<section class="card">
  <div class="chips"><span class="chip ai">DI</span><span class="chip ${b[1]}">${b[0]} tikrumas</span>${f.sel?'<span class="chip">Tavo pasirinkimas</span>':''}</div>
  <div class="row" style="align-items:flex-end;justify-content:space-between"><div><h3 style="font-size:1.3em">${sp.lt}</h3><p class="la">${sp.la}</p></div><span class="big-pct">${p}&nbsp;%</span></div>
  <div class="meter ${b[1]}"><i style="width:${p}%"></i></div>
  <p class="xs mute">Palyginamosios nuotraukos iš bazės</p>
  <div class="grid3">${ph(f.photos[0].img,'tavo','',f.photos[0].url)}${(sp.cmp||[sp.img,sp.img]).map((im,j)=>ph(im,['pavyzdys','iš bazės'][j])).join('')}</div>
  <p class="small"><b>Skiriamasis požymis:</b> ${sp.feat}</p>
</section>
<div class="row"><button class="btn" data-a="go" data-v="f1why">${I('info')} Kodėl?</button><button class="btn" data-a="f1again">${I('redo')} Nauja nuotrauka</button></div>
<span class="lbl">Kandidatai · paliesk, kad palygintum</span>
<div class="stack" role="radiogroup" aria-label="Kandidatai">
${c.map(([kk,pp],i)=>`<label class="crow ${f.sel===i?'sel':''}"><input type="radio" name="cand" data-a="f1sel" data-i="${i}" ${f.sel===i?'checked':''}>${ph(SP[kk].img)}<span><span class="n">${SP[kk].lt}</span><br><span class="la small">${SP[kk].la}</span></span><span class="pc">${pp} %</span></label>`).join('')}
</div>
${low?'':dangerNote([k])}
<button class="link" data-a="f1none">Nė vienas netinka: ieškoti kataloge</button>`};
ACT.f1res=()=>{const f=S.f1,o=f.out,[k]=o.c[f.sel];
return o.genus?`<button class="btn pri" data-a="f1saveGenus">Išsaugoti kaip gentį</button><button class="btn" data-a="f1confirm">Vis tiek: ${SP[k].lt}</button>`
:`<button class="btn pri big" data-a="f1confirm">${I('check')} Tai mano augalas</button>`};

T.f1why='Kodėl šis rezultatas?';
V.f1why=()=>{const f=S.f1,o=f.out,[k,p]=o.c[f.sel],sp=SP[k],alt=o.c.filter((_,i)=>i!==f.sel);
return `
<div class="ph" style="max-width:280px">${f.photos[0].url?`<img src="${f.photos[0].url}" alt="">`:art(f.photos[0].img)}${regOverlay(...o.reg)}<span class="cap">geltona sritis lėmė rezultatą</span></div>
<div class="card">
  <div class="chips"><span class="chip ai">DI</span><span class="chip ${BAND(p)[1]}">${p} % · ${BAND(p)[0]}</span></div>
  <h3>${sp.lt}</h3>
  <p class="small"><b>Ką DI matė:</b> ${sp.feat}</p>
</div>
<div class="card"><h3>Kuo skiriasi nuo kitų kandidatų</h3>
<ul class="clean small">${alt.map(([a,ap])=>`<li><b>${SP[a].lt}</b> (${ap} %): ${SP[a].feat}</li>`).join('')}</ul></div>
<div class="card soft"><p class="small"><b>Kada abejoti:</b> kai tikrumas &lt; 50 %, kai kandidatai skiriasi &lt; 15 p. p., kai nufotografuota tik dalis augalo arba jis nežydi.</p>
<p class="small"><b>Kodėl kartais sakome „Nesu tikras“:</b> užtikrintai pasakyta neteisinga rūšis kainuoja brangiausiai, nes ja aklai pasitikima. Todėl abejodami prašome dar vienos nuotraukos.</p></div>`};
ACT.f1why=()=>`<button class="btn pri" data-a="back">Grįžti į rezultatą</button>`;

T.f1low='Patvirtinti su įspėjimu';
V.f1low=()=>{const f=S.f1,o=f.out,[k,p]=o.c[f.sel];return `
${note('warn','warn',`Tikrumas žemas (${p} %)`,`Gali išsaugoti <b>${SP[k].lt}</b>, bet rūšis gali būti neteisinga. Ligų patikra rems šia rūšimi.`)}
${dangerNote(o.c.map(x=>x[0]))}
<label class="sw card"><input type="checkbox" data-a="f1lowOk" ${f.lowOk?'checked':''}><span>Suprantu, kad rūšis gali būti neteisinga, ir patikrinau ją pats (-i)</span></label>`};

T.f1cat='Katalogas';
V.f1cat=()=>{const f=S.f1;const q=f.q.trim().toLowerCase();const list=q.length<2?CATALOG:CATALOG.filter(k=>SP[k].lt.toLowerCase().includes(q)||SP[k].la.toLowerCase().includes(q));
return `
<p class="small mute">Paieška be DI: rask augalą pagal pavadinimą ir palygink pats (-i).</p>
<label class="f">Augalo pavadinimas <span class="h">Lietuviškai arba lotyniškai, bent 2 raidės</span>
<input type="search" data-a="f1q" maxlength="40" value="${esc(f.q)}" placeholder="pvz., monstera" autocomplete="off" ${q.length>=2&&!list.length?'aria-invalid="true"':''}></label>
${q.length===1?`<p class="xs mute">Įvesk dar bent vieną raidę.</p>`:''}
${q.length>=2&&!list.length?note('warn','search',`Nieko nerasta pagal „${esc(f.q)}“`,'Patikrink rašybą arba pabandyk lotynišką pavadinimą.'):''}
<div class="stack" role="radiogroup" aria-label="Katalogo rezultatai">${list.map(k=>`<label class="crow ${f.catSel===k?'sel':''}"><input type="radio" name="cat" data-a="f1catSel" data-v="${k}" ${f.catSel===k?'checked':''}>${ph(SP[k].img)}<span><span class="n">${SP[k].lt}</span><br><span class="la small">${SP[k].la}</span></span><span></span></label>`).join('')}</div>
${f.catErr?`<p class="err-t" role="alert">${I('warn',18)} ${f.catErr}</p>`:''}`};
ACT.f1cat=()=>`<button class="btn pri" data-a="f1catSave">Išsaugoti pasirinktą</button>`;

T.f1saved='Išsaugota';
V.f1saved=()=>{const pl=plantById(S.plantId);if(!pl)return note('info','info','Išsaugojimas atšauktas','Rūšis neišsaugota.');
const sp=SP[pl.sp];return `
<div class="card hero" style="text-align:center;justify-items:center">
  <span style="width:56px;height:56px;border-radius:50%;background:var(--strong);color:var(--onstrong);display:grid;place-items:center">${I('check',30)}</span>
  <h2>Išsaugota</h2>
  <p><b>${sp.lt}</b><br><span class="la">${sp.la}</span></p>
  <div class="chips" style="justify-content:center"><span class="chip">${pl.srcShort}</span>${pl.unverified?'<span class="chip mid">nepatikrinta</span>':''}${pl.expert?'<span class="chip hi">eksperto žyma</span>':''}</div>
</div>
${dangerNote([pl.sp])}
${pl.spots?note('info','pulse','Matome dėmių. Patikrinti ligą?','Rūšis jau patvirtinta, todėl ligų patikra prasidės iškart.'):''}`};
ACT.f1saved=()=>{const pl=plantById(S.plantId);if(!pl)return `<button class="btn pri" data-a="back">Grįžti į rezultatą</button>`;
return `<button class="btn ${pl.spots?'pri':''}" data-a="f2forPlant" data-v="${pl.id}">${I('pulse')} Patikrinti, ar serga</button><button class="btn" disabled>Priežiūros planas (F3, kito nario funkcija)</button>`};

/* ---------- Mano augalai ---------- */
T.plants='Mano augalai';
V.plants=()=>S.plants.length?S.plants.map(plantRow).join('')
:`<div class="card soft" style="text-align:center"><p class="small mute">Dar neturi išsaugotų augalų.<br>Atpažintas augalas atsiras čia.</p></div>`;
ACT.plants=()=>S.plants.length?'':`<button class="btn pri" data-a="startF1">${I('cam')} Atpažinti augalą</button>`;

T.plant='Augalas';
V.plant=()=>{const p=plantById(S.plantId);if(!p)return '';const sp=SP[p.sp];return `
<div class="row" style="align-items:center">${ph(p.img,'','',p.url).replace('class="ph"','class="ph" style="width:88px;flex:none"')}<div><h2>${sp.lt}</h2><p class="la">${sp.la}</p><div class="chips" style="margin-top:6px"><span class="chip">${p.srcShort}</span>${p.unverified?'<span class="chip mid">nepatikrinta</span>':''}${p.expert?'<span class="chip hi">eksperto žyma</span>':''}</div></div></div>
${dangerNote([p.sp])}
${p.treat?`<div class="card"><span class="lbl">Ligų patikra</span><h3>${DIS[p.treat.d].lt}</h3>
<p class="small">Pasirinkta: ${p.treat.acts.length?p.treat.acts.map(esc).join('; '):'—'}</p>
<p class="small row">${I('bell',16)} ${p.treat.remind?'Priminimas po 7 d. įjungtas':'Priminimas neįjungtas'}${p.treat.result?' · '+p.treat.result:''}</p>
<div class="demo"><span class="chip demo">Prototipas · laikas</span><button class="btn" data-a="f2recheck">${I('clock')} Imituoti: praėjo 7 dienos</button></div></div>`:''}
<div class="card"><h3>Ar rūšis teisinga?</h3>
<div class="row"><button class="btn" data-a="fbYes">${I('check')} Taip</button><button class="btn" data-a="chgStart">${I('edit')} Pakeisti rūšį</button></div></div>
${S.delAsk?note('err','trash',`Ištrinti ${sp.lt}?`,'Bus ištrinta nuotrauka ir istorija.',`<div class="row" style="margin-top:8px"><button class="btn danger" data-a="delDo">Ištrinti</button><button class="btn" data-a="delNo">Ne</button></div>`):''}`};
ACT.plant=()=>`<button class="btn pri" data-a="f2forPlant" data-v="${S.plantId}">${I('pulse')} Patikrinti, ar serga</button><button class="btn danger" data-a="delAsk">${I('trash')} Ištrinti iš istorijos</button>`;

T.chg='Pakeisti rūšį';
V.chg=()=>{const p=plantById(S.plantId);const opts=[...new Set([...(p.cands||[]),'mon','ada','pothos','rose','canina'])].filter(k=>k!==p.sp).slice(0,5);
return `
<p class="small">Dabar: <b>${SP[p.sp].lt}</b>. Pasirink teisingą rūšį, pvz., kai pražydus paaiškėjo, kad tai kita rūšis.</p>
<div class="stack" role="radiogroup" aria-label="Rūšys">${opts.map(k=>`<label class="crow ${S.chg===k?'sel':''}"><input type="radio" name="chg" data-a="chgSel" data-v="${k}" ${S.chg===k?'checked':''}>${ph(SP[k].img)}<span><span class="n">${SP[k].lt}</span><br><span class="la small">${SP[k].la}</span></span>${(p.cands||[]).includes(k)?'<span class="chip ai">DI</span>':'<span></span>'}</label>`).join('')}</div>
<button class="link" data-a="chgCat">Ieškoti kataloge</button>`};
ACT.chg=()=>`<button class="btn pri" data-a="chgNext" ${S.chg?'':'disabled'}>Toliau</button><button class="btn" data-a="startF1">${I('cam')} Fotografuoti iš naujo</button>`;
T.chgok='Patvirtink pakeitimą';
V.chgok=()=>{const p=plantById(S.plantId);return `
<div class="card"><p class="row" style="flex-wrap:wrap"><s class="mute">${SP[p.sp].lt}</s> ${I('chev',16)} <b>${SP[S.chg].lt}</b></p>
<p class="small">Bus perskaičiuota ir parodyta patvirtinti:</p><ul class="clean small"><li>F3 priežiūros planas (laistymas, šviesa)</li><li>F4 priežiūros klaidų rizika</li><li>Pavojingumo įspėjimas</li></ul></div>
${dangerNote([S.chg])}
<p class="xs mute">${S.train?`Pataisymas bus išsiųstas modeliui kaip grįžtamasis ryšys${S.expert?' su eksperto žyma':''}.`:'Pataisymas modeliui nesiunčiamas (mokymas išjungtas).'}</p>`};
ACT.chgok=()=>`<button class="btn pri" data-a="chgDo">Patvirtinti naują rūšį</button>`;

/* ---------- F2: kuriam augalui ---------- */
T.f2pick='Ligų patikra';
V.f2pick=()=>S.plants.length?`<p class="mute">Kuriam augalui tikrinti ligą?</p>${S.plants.map(p=>`<button class="prow" data-a="f2forPlant" data-v="${p.id}">${ph(p.img,'','',p.url)}<span><b>${SP[p.sp].lt}</b><br><span class="la small">${SP[p.sp].la}</span></span>${I('chev',18)}</button>`).join('')}`
:`${note('warn','info','Rūšis dar nepatvirtinta','Ligos priklauso nuo augalo rūšies, todėl pirmiausia atpažink augalą ir patvirtink rūšį.')}
<div class="demo"><span class="chip demo">Prototipas · greitas startas</span><button class="btn" data-a="seedRose">Naudoti pavyzdį: Algio rožė</button></div>`;
ACT.f2pick=()=>`<button class="btn ${S.plants.length?'':'pri'}" data-a="f1fromF2">${I('cam')} ${S.plants.length?'Augalo nėra sąraše: atpažinti':'Atpažinti augalą (F1)'}</button>`;

/* ---------- F2: nuotraukos ir klausimai ---------- */
T.f2cap='Ligų patikra';
V.f2cap=()=>{const f=S.f2,p=plantById(f.plantId);const sel=id=>f.photos.some(x=>x.sample===id);const hasWhole=f.photos.some(x=>x.part==='Visas augalas');const q=f.q,qe=f.qErr;
return `
<div class="prow" style="cursor:default">${ph(p.img,'','',p.url)}<span><b>${SP[p.sp].lt}</b><br><span class="xs mute">Rūšis patvirtinta F1</span></span><span></span></div>
<div><h3>1. Nufotografuok pažeistą lapą</h3><p class="small mute">Būtina pažeistos vietos nuotrauka iš arti. Viso augalo nuotrauka nebūtina, bet padidina tikrumą.</p></div>
<div class="demo">
  <span class="chip demo" style="justify-self:start">Prototipas · kamera</span>
  <div class="grid2">${F2S.map(s=>`<button class="sample" data-a="f2pick" data-v="${s.id}" aria-pressed="${sel(s.id)}">${ph(s.img)}<b>${s.t}</b><span class="h">${s.k}</span></button>`).join('')}</div>
  <label class="sw small"><input type="checkbox" data-a="tog" data-v="slow" ${S.slow?'checked':''}><span>Imituoti silpną ryšį (K6)</span></label>
</div>
<label class="btn" style="cursor:pointer">${I('img')} Įkelti iš galerijos<input type="file" accept="image/*" data-a="f2file" class="sr"></label>
${f.err?`<p class="err-t" role="alert">${I('warn',18)} ${esc(f.err)}</p>`:''}
${f.photos.length?`<div class="thumbs">${f.photos.map((x,i)=>`<div><div style="position:relative">${ph(x.img,x.part==='Visas augalas'?'visas augalas':'pažeista vieta','',x.url)}<button class="x" data-a="f2rm" data-i="${i}" aria-label="Pašalinti nuotrauką">${I('x',16)}</button></div></div>`).join('')}</div>`:''}
${f.noDmg?`<p class="err-t" role="alert">${I('warn',18)} Reikia pažeistos vietos nuotraukos.</p>`:''}
${f.photos.length&&!hasWhole?`<p class="xs mute">Patarimas: pridėk viso augalo nuotrauką. Su viena nuotrauka tikrumas mažesnis.</p>`:''}
<div><h3>2. Trys trumpi klausimai</h3><p class="small mute">Atsakymai padeda atskirti ligą nuo kenkėjų ir priežiūros klaidų.</p></div>
<div class="card">
<label class="f">Kada pastebėjai pakitimus? <select data-a="f2q" data-v="when" ${qe&&!q.when?'aria-invalid="true"':''}><option value="">Pasirink…</option>${['Šiandien','Šią savaitę','Prieš daugiau nei savaitę','Nežinau'].map(o=>`<option ${q.when===o?'selected':''}>${o}</option>`).join('')}</select></label>
${qe&&!q.when?`<p class="err-t">${I('warn',16)} Pasirink, kada pastebėjai.</p>`:''}
${[['spread','Ar dėmės plinta į kitus lapus?'],['bugs','Ar matyti vabzdžių?']].map(([k,t])=>`<fieldset><legend>${t}</legend><div class="seg">${['Taip','Ne','Nežinau'].map(o=>`<label><input type="radio" name="${k}" data-a="f2q" data-v="${k}" value="${o}" ${q[k]===o?'checked':''}>${o}</label>`).join('')}</div>${qe&&!q[k]?`<p class="err-t">${I('warn',16)} Pasirink atsakymą.</p>`:''}</fieldset>`).join('')}
${q.bugs==='Taip'?`<p class="xs mute">Patarimas: nufotografuok vabzdžius iš arti, tai padės atskirti kenkėjus nuo ligos.</p>`:''}
</div>`};
ACT.f2cap=()=>`<button class="btn pri big" data-a="f2analyze">Tikrinti ligą</button>`;

/* ---------- F2: rezultatas ---------- */
const curDis=()=>S.f2.out.c[S.f2.di];
const dmgPhoto=()=>S.f2.photos.find(x=>x.part==='Pažeista dalis');
T.f2res='Patikros rezultatas';
V.f2res=()=>{const f=S.f2,o=f.out,dmg=dmgPhoto();
if(o.status==='Ligos požymių nerasta')return `
<section class="card">
  <div class="chips"><span class="chip ai">DI</span><span class="chip hi">${o.p} % · ${BAND(o.p)[0]}</span></div>
  <h3 style="font-size:1.3em">Ligos požymių nerasta</h3>
  ${ph(dmg.img,'tavo nuotrauka','',dmg.url).replace('class="ph"','class="ph" style="max-width:200px"')}
  <p class="small">Tai nereiškia, kad augalas tikrai sveikas: DI įvertino tik šią nuotrauką. Jei pakitimai plinta, pakartok patikrą po kelių dienų.</p>
  <p class="xs mute">Mažiausiai tikėtinos: ${o.c.map(([d,p])=>`${DIS[d].lt} ${p} %`).join(', ')}</p>
</section>
<button class="btn" data-a="f2remindNone">${I('bell')} Priminti patikrinti po 7 d.</button>
<button class="btn" disabled>Gal tai priežiūros klaida? (F4, kito nario funkcija)</button>`;
const low=o.status==='Neaišku';const [d,p]=curDis();const D=DIS[d];const b=BAND(p);
const pic=`<div class="ph">${dmg.url?`<img src="${dmg.url}" alt="">`:art(dmg.img)}${f.showSpots?spotsOverlay(o.spots):''}<span class="cap">${f.showSpots?'pažymėtos pažeistos vietos':'tavo nuotrauka'}</span></div>`;
if(low)return `
${note('warn','info',`Neaišku: tikrumas žemas (${o.c[0][1]} %)`,'Požymiai gali reikšti ne ligą, o maisto medžiagų trūkumą ar saulės nudegimą. Cheminių priemonių nerodome.')}
<div class="grid2">${pic}<div class="stack">${o.c.map(([k,pp])=>`<div><p class="small"><b>${DIS[k].lt}</b>${DIS[k].kind!=='liga'?' <span class="chip">ne liga</span>':''}</p><div class="row"><div class="meter lo" style="flex:1"><i style="width:${pp}%"></i></div><span class="xs" style="font-family:var(--mono)">${pp} %</span></div></div>`).join('')}</div></div>
<label class="sw small"><input type="checkbox" data-a="f2spots" ${f.showSpots?'checked':''}> Rodyti pažymėtas vietas</label>
<div class="card soft"><h3>Ką saugu daryti jau dabar</h3><ul class="clean small">${[DIS.bs.safe[0],DIS.bs.safe[1],DIS.kdef.safe[0]].map(s=>`<li>${s}</li>`).join('')}</ul></div>
<div class="row"><button class="btn" data-a="go" data-v="f2why">${I('info')} Kodėl neaišku?</button><button class="btn" data-a="go" data-v="f2spec">${I('user')} Specialistui</button></div>`;
return `
<section class="card">
  <div class="chips"><span class="chip ai">DI</span><span class="chip ${b[1]}">${b[0]} tikrumas</span>${f.di?'<span class="chip">Tavo pasirinkimas</span>':''}</div>
  <div class="row" style="align-items:flex-end;justify-content:space-between"><div><span class="lbl">${f.di?'Tavo pasirinkta diagnozė':o.status}</span><h3 style="font-size:1.3em">${D.lt}</h3><p class="la">${D.la}</p></div><span class="big-pct">${p}&nbsp;%</span></div>
  <div class="meter ${b[1]}"><i style="width:${p}%"></i></div>
  ${p<50?`<p class="small">${I('info',16)} DI tikrumas šiai diagnozei žemas, todėl cheminių priemonių nesiūlysime.</p>`:''}
  <div class="grid3">${pic}${ph(D.img,'pavyzdys')}${ph(D.img,'iš bazės')}</div>
  <label class="sw small"><input type="checkbox" data-a="f2spots" ${f.showSpots?'checked':''}> Rodyti pažymėtas vietas</label>
  <p class="small"><b>Požymiai:</b> ${D.feat}</p>
  ${f.photos.length===1?`<p class="xs mute">Analizuota tik viena nuotrauka. Su viso augalo nuotrauka tikrumas būtų didesnis.</p>`:''}
</section>
<div class="row"><button class="btn" data-a="go" data-v="f2why">${I('info')} Kodėl?</button><button class="btn" data-a="go" data-v="f2rej">${I('x')} Ne ta liga</button></div>
<span class="lbl">Kiti kandidatai</span>
${o.c.map(([k,pp],i)=>i===f.di?'':`<div class="row small" style="justify-content:space-between;padding:0 4px"><span>${DIS[k].lt}</span><span style="font-family:var(--mono)">${pp} %</span></div>`).join('')}
<details class="more"><summary>Kodėl ligą rodome jau nuo vidutinio tikrumo?</summary><div><p class="small">Praleista liga (FN) kainuoja brangiausiai: ji plinta ir sunaikina derlių. Todėl geriau perspėti. Žalą dėl galimos klaidos mažina tai, kad pirmiausia siūlome nekenksmingus veiksmus, o chemiją tik patvirtinus diagnozę.</p></div></details>`};
ACT.f2res=()=>{const o=S.f2.out;
if(o.status==='Ligos požymių nerasta')return `<button class="btn pri" data-a="home">Baigti patikrą</button><button class="btn" data-a="f2again">${I('cam')} Nauja nuotrauka</button>`;
if(o.status==='Neaišku')return `<button class="btn pri big" data-a="f2again">${I('cam')} Nauja nuotrauka iš arčiau</button>`;
return `<button class="btn pri big" data-a="f2confirm">${I('check')} Panašu: patvirtinti diagnozę</button>`};

T.f2why='Kodėl?';
V.f2why=()=>{const f=S.f2,o=f.out,[d,p]=curDis(),D=DIS[d],dmg=dmgPhoto();return `
<div class="ph" style="max-width:280px">${dmg.url?`<img src="${dmg.url}" alt="">`:art(dmg.img)}${spotsOverlay(o.spots)}<span class="cap">pažymėtos vietos lėmė rezultatą</span></div>
<div class="card">
  <div class="chips"><span class="chip ai">DI</span><span class="chip ${BAND(p)[1]}">${p} % · ${BAND(p)[0]}</span></div>
  <h3>${D.lt}</h3>
  <p class="small"><b>Požymiai žodžiais:</b> ${D.feat}</p>
  <p class="small"><b>Tavo atsakymai:</b> pastebėta „${esc(f.q.when.toLowerCase())}“, plinta – „${esc(f.q.spread.toLowerCase())}“, vabzdžių – „${esc(f.q.bugs.toLowerCase())}“.</p>
  ${o.status==='Neaišku'?`<p class="small"><b>Kodėl neaišku:</b> dėmės neryškios, o rudi kraštai būdingi ir kalio trūkumui (${o.c[1][1]} %), ir saulės nudegimui (${o.c[2][1]} %).</p>`:''}
  ${f.photos.length===1?`<p class="small"><b>Abejok labiau:</b> analizuota tik viena nuotrauka.</p>`:''}
</div>
<div class="card soft"><p class="small"><b>Šaltinis:</b> požymiai ir gydymo rekomendacijos iš patikrintos augalų apsaugos bazės (prototipe pavyzdiniai duomenys). Reklamos nėra.</p></div>`};
ACT.f2why=()=>`<button class="btn pri" data-a="back">Grįžti</button>`;

T.f2rej='Ne ta liga';
V.f2rej=()=>{const f=S.f2;return `
<h2>Kas, tavo nuomone, tai yra?</h2>
<div class="stack">${f.out.c.map(([k,p],i)=>i===f.di?'':`<button class="crow" style="grid-template-columns:1fr auto" data-a="f2alt" data-i="${i}"><span class="n">${DIS[k].lt}</span><span class="pc">${p} %</span></button>`).join('')}
<button class="crow" style="grid-template-columns:auto 1fr" data-a="f2healthy">${I('leaf')}<span class="n">Augalas sveikas (uždaryti patikrą)</span></button>
<button class="crow" style="grid-template-columns:auto 1fr" data-a="go" data-v="f2spec">${I('user')}<span class="n">Nežinau: siųsti specialistui</span></button></div>`};
T.f2closed='Patikra uždaryta';
V.f2closed=()=>note('ok','check','Patikra uždaryta','Pažymėjai, kad augalas sveikas. Diagnozė neišsaugota, veiksmai nesiūlomi.'+(S.train?' Atsakymas padės modeliui.':''));
ACT.f2closed=()=>`<button class="btn pri" data-a="home">Į pradžią</button>`;

/* ---------- F2: veiksmai ---------- */
T.f2plan='Ką darysi?';
V.f2plan=()=>{const f=S.f2,[d,dp]=curDis(),D=DIS[d];const chemOk=dp>=50;const box=t=>`<label><input type="checkbox" data-a="f2act" value="${esc(t)}" ${f.acts.has(t)?'checked':''}><span class="small">${t}</span></label>`;
return `
${note('ok','check',`Diagnozė patvirtinta: ${D.lt}`,'Pažymėk, ką darysi. Niekas neperkama ir nepurškiama automatiškai.')}
<div class="tier"><span class="lbl"><span class="dot" style="background:var(--leaf)"></span>1 · Nekenksmingi (pradėk nuo jų)</span>${D.safe.map(box).join('')}</div>
${D.bio.length?`<div class="tier"><span class="lbl"><span class="dot" style="background:#3b8f8a"></span>2 · Biologinės priemonės</span>${D.bio.map(box).join('')}</div>`:''}
${D.chem.length?(chemOk?`<details class="more"><summary><span class="dot" style="background:var(--red)"></span> 3 · Cheminės (tik jei kiti nepadeda)</summary><div>${D.chem.map(box).join('').replace(/<label>/g,'<label class="sw">')}<p class="xs mute">Tik Lietuvoje registruoti produktai, laikykis etiketės (VMVT augalų apsaugos produktų registras).</p></div></details>`
:`<p class="small mute">${I('info',16)} Cheminių priemonių nerodome: DI tikrumas šiai diagnozei ${dp} % (&lt; 50 %). Abejojant pasitark su specialistu.</p>`):''}
<p class="xs mute">Šaltinis: patikrinta augalų apsaugos bazė (pavyzdiniai duomenys). Reklamos nėra.</p>
<label class="sw card"><input type="checkbox" data-a="f2remind" ${f.remind?'checked':''}><span><b>Priminti po 7 dienų patikrinti, ar gerėja</b><br><span class="small mute">Palyginsime naują nuotrauką su šia.</span></span></label>
${f.err?`<p class="err-t" role="alert">${I('warn',18)} ${f.err}</p>`:''}`};
ACT.f2plan=()=>`<button class="btn pri big" data-a="f2save">Išsaugoti mano sprendimą</button>`;

T.f2done='Sprendimas išsaugotas';
V.f2done=()=>{const p=plantById(S.f2.plantId);if(!p||!p.treat)return note('info','info','Sprendimas atšauktas','Niekas neišsaugota.');
return `

function render(){
  const s=S.screen;const tab=TAB[s];
  document.documentElement.classList.toggle('big',!!S.big);
  const act=ACT[s]?ACT[s]():'';
  document.getElementById('app').innerHTML=`
<header class="bar">${s==='home'?`<h1 style="font-size:1.55em">Augalai</h1><button class="ibtn" data-a="big" aria-pressed="${!!S.big}" aria-label="${S.big?'Įprastas':'Didesnis'} šriftas" title="Šrifto dydis">Aa</button>`
  :`<button class="pill" data-a="back">‹ Atgal</button><h1>${T[s]||''}</h1>`}</header>
<main class="${act?'has-act':''}">${V[s]()}</main>
${act?`<div class="act" role="region" aria-label="Veiksmai">${act}</div>`:''}
<nav class="tabs" aria-label="Pagrindinis meniu">${[['home','Pradžia','home'],['cam','Atpažinti','startF1'],['pulse','Ligų patikra','startF2'],['leaf','Mano augalai','tabPlants']].map(([i,t,a],k)=>`<button data-a="${a}" class="${tab===k?'on':''}" ${tab===k?'aria-current="page"':''}>${I(i,22)}${t}</button>`).join('')}</nav>`;
  renderToast();fitPad();fixHeadings();
}
function fixHeadings(){let prev=1;document.querySelectorAll('main h2,main h3,main h4').forEach(h=>{h.removeAttribute('aria-level');let l=+h.tagName[1];if(l>prev+1){l=prev+1;h.setAttribute('aria-level',l)}prev=l})}
function fitPad(){if(matchMedia('(min-width:900px)').matches){const m=document.querySelector('main');if(m)m.style.paddingBottom='';return}const m=document.querySelector('main'),a=document.querySelector('.act'),n=document.querySelector('nav.tabs');if(!m)return;m.style.paddingBottom='';const need=(a?a.offsetHeight:0)+(n?n.offsetHeight:0)+24;if(need>parseFloat(getComputedStyle(m).paddingBottom))m.style.paddingBottom=need+'px'}
addEventListener('resize',fitPad);

/* ================= ANALIZĖ (laikmačiai) ================= */
function startAnalysis(fn){
  const photos=fn==='f1'?S.f1.photos:S.f2.photos;
  S.lastFn=fn;S.an={fn,photos,t:0,stage:fn==='f1'?'q':'a',need:fn==='f1'?1:4,slowAsk:false,waiting:false};
  go('an');
}
function enter(){
  if(S.screen!=='an'||!S.an)return;
  const a=S.an;
  timers.push(setInterval(()=>{
    a.t++;
    if(a.fn==='f1'&&a.stage==='q'&&a.t>=1){
      if(S.f1.photos.some(p=>p.bad)&&!S.f1.forced){clearT();S.an=null;go('f1bad',{replace:true});S.stack.pop();S.stack.push('f1cap');return}
      a.stage='a';a.need=3;a.t=0;
    }
    if(S.slow){
      if(a.t>=10&&!a.slowAsk){a.slowAsk=true;say('Analizė užtrunka');}
      if(a.slowAsk&&!a.waiting&&a.t>=10){a.t=10;render();return} // laukia sprendimo
      if(a.waiting&&a.t>=20){clearT();S.queue=[{fn:a.fn}];S.an=null;S.screen='f1off';render();return}
      render();return;
    }
    if(a.stage==='a'&&a.t>=a.need){clearT();finish(a.fn);return}
    render();
  },500)); // 1 rodoma sekundė = 0,5 s realaus laiko
}
function finish(fn){
  S.an=null;
  if(fn==='f1'){const f=S.f1;f.out=F1OUT[f1Outcome()];f.sel=0;f.lowOk=false;S.screen='f1res';}
  else{const f=S.f2;f.out=F2OUT[f2Outcome()];f.di=0;f.showSpots=true;S.screen='f2res';}
  render();say('Rezultatas paruoštas');
}
function f1Outcome(){
  const ids=S.f1.photos.map(p=>p.sample||'upload');
  if(ids.includes('barZ'))return 'bar';
  if(ids.includes('bar'))return 'barLow';
  if(ids.includes('rose'))return 'rose';
  if(ids.includes('mon')||ids.includes('upload'))return S.f1.forced&&ids.includes('blur')?'monLow':'mon';
  if(ids.includes('stem'))return 'genus';
  return 'monLow';
}
function f2Outcome(){
  const ids=S.f2.photos.map(p=>p.sample||'upload');const whole=S.f2.photos.some(p=>p.part==='Visas augalas');
  if(ids.includes('r_bs')||ids.includes('upload'))return whole?'bsW':'bs';
  if(ids.includes('r_un'))return 'low';
  return 'none';
}

function needIntro(next){if(!S.intro){S.afterIntro=next;go('intro');return true}return false}
function savePlant(spKey,src,extra={}){
  const f=S.f1;const ph0=f.photos[0]||{img:SP[spKey].img};
  const pl={id:S.nextId++,sp:spKey,srcShort:/katalog/i.test(src)?'katalogas, be DI':/gentis/.test(src)?'gentis':'DI + patvirtinta',img:ph0.img,url:ph0.url,src,date:new Date().toLocaleDateString('lt-LT'),cands:f.out?f.out.c.map(x=>x[0]):[],spots:!!(f.out&&f.out.spots),expert:S.expert,...extra};
  S.plants.unshift(pl);S.plantId=pl.id;
  go('f1saved');
  toast('Išsaugota „Mano augaluose“',()=>{S.plants=S.plants.filter(p=>p.id!==pl.id);S.plantId=null;render();say('Išsaugojimas atšauktas')});
}
function readFiles(files,max,cur,onOk,setErr){
  const arr=[...files];
  if(cur+arr.length>max){setErr(`Galima ne daugiau kaip ${max} nuotr. Pašalink kurią nors.`);return}
  for(const fl of arr){
    if(!/^image\/(jpeg|png)$/.test(fl.type)){setErr(`„${fl.name}“ netinka: galima tik JPG arba PNG.`);return}
    if(fl.size>10*1024*1024){setErr(`„${fl.name}“ per didelė (daugiau nei 10 MB).`);return}
  }
  setErr('');
  arr.forEach(fl=>{const url=URL.createObjectURL(fl);const im=new Image();im.onload=()=>{onOk({url,low:im.naturalWidth<200||im.naturalHeight<200})};im.onerror=()=>setErr('Nepavyko atidaryti failo.');im.src=url;});
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA')return;

document.addEventListener('change',e=>{const el=e.target;const a=el.dataset&&el.dataset.a;if(!a)return;
  if(a==='f1file'){const f=S.f1;readFiles(el.files,3,f.photos.length,({url,low})=>{if(f.photos.length>=3)return;f.photos.push({sample:null,url,img:'upload',part:'Lapas',bad:low?'Per maža raiška (mažiau nei 200 px).':''});render()},m=>{f.err=m;render()});el.value='';return}
  if(a==='f2file'){const f=S.f2;readFiles(el.files,3,f.photos.length,({url,low})=>{if(low){f.err='Nuotrauka per maža (mažiau nei 200 px). Nufotografuok iš arčiau.';render();return}f.photos=f.photos.filter(p=>p.part!=='Pažeista dalis');f.photos.push({sample:null,url,img:'upload',part:'Pažeista dalis'});render()},m=>{f.err=m;render()});el.value='';return}
